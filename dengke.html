  <style>

    * {
      box-sizing: border-box;
      margin: 0;

    }


    html {
      scroll-behavior: smooth;
    }


    body {

      background: #111;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    a {

      color: inherit;

      text-decoration: none;
    }


    /* =========================
       NAVIGATION
       ========================= */

    nav {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      padding: 28px 40px;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      z-index: 100;
    }


    .logo {

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 2px;
    }


    .menu {

      display: flex;

      gap: 30px;

      font-size: 11px;

      letter-spacing: 2px;
    }


    .menu a {

      transition:
        opacity 0.3s ease;
    }


    .menu a:hover {

      opacity: 0.5;
    }


    /* =========================
       PROJECT INTRODUCTION
       ========================= */

    .project-intro {

      width: 100%;

      padding:

        125px
        40px
        55px;

      text-align: left;
    }


    .project-intro h1 {

      font-size: 22px;

      font-weight: 500;

      letter-spacing: 1px;

      margin-bottom: 20px;
    }


    .project-intro p {

      max-width: 560px;

      font-size: 13px;

      line-height: 1.7;

      color: #999;
    }


    /* =========================
       COMPACT IRREGULAR GRID
       ========================= */

    .gallery {

      width: 100%;

      padding:

        0
        24px
        80px;

      display: grid;

      grid-template-columns:
        repeat(12, 1fr);

      gap: 10px;
    }


    .photo {

      overflow: hidden;

      background: #222;

      min-width: 0;
    }


    .photo img {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

      transition:

        transform 0.4s ease,

        opacity 0.4s ease;
    }


    .photo:hover img {

      transform: scale(1.025);

      opacity: 0.88;
    }


    /* =========================
       COMPACT PHOTO SIZES
       ========================= */

    .photo-1 {

      grid-column:
        1 / 5;

      aspect-ratio:
        4 / 3;
    }


    .photo-2 {

      grid-column:
        5 / 8;

      aspect-ratio:
        3 / 4;
    }


    .photo-3 {

      grid-column:
        8 / 11;

        3 / 4;

      margin-top:
        35px;
