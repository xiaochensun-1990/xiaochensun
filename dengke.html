<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dengke — XIAOCHEN SUN</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      background: #111;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    a {

      color: inherit;

      text-decoration: none;
    }


    /* =========================
       NAVIGATION
       ========================= */

    nav {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      padding: 28px 40px;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      z-index: 100;
    }


    .logo {

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 2px;
    }


    .menu {

      display: flex;

      gap: 30px;

      font-size: 11px;

      letter-spacing: 2px;
    }


    .menu a {

      transition:
        opacity 0.3s ease;
    }


    .menu a:hover {

      opacity: 0.5;
    }


    /* =========================
       PROJECT INTRODUCTION
       ========================= */

    .project-intro {

      width: 100%;

      padding:

        150px
        40px
        100px;

      text-align: left;
    }


    .project-intro h1 {

      font-size: 28px;

      font-weight: 500;

      letter-spacing: 1px;

      margin-bottom: 30px;
    }


    .project-intro p {

      max-width: 650px;

      font-size: 15px;

      line-height: 1.8;

      color: #aaa;
    }


    /* =========================
       IRREGULAR PHOTO GRID
       ========================= */

    .gallery {

      width: 100%;

      padding:

        0
        30px
        120px;

      display: grid;

      grid-template-columns:
        repeat(12, 1fr);

      gap: 30px;
    }


    .photo {

      overflow: hidden;

      background: #222;
    }


    .photo img {

      width: 100%;

      height: 100%;

      display: block;

      object-fit: cover;

      transition:

        transform 0.6s ease,

        opacity 0.5s ease;
    }


    .photo:hover img {

      transform: scale(1.025);

      opacity: 0.88;
    }


    /* =========================
       DIFFERENT PHOTO SIZES
       ========================= */

    .photo-1 {

      grid-column:
        1 / 8;

      aspect-ratio:
        4 / 3;
    }


    .photo-2 {

      grid-column:
        9 / 13;

      aspect-ratio:
        3 / 4;

      margin-top:
        80px;
    }


    .photo-3 {

      grid-column:
        2 / 6;

      aspect-ratio:
        3 / 4;

      margin-top:
        40px;
    }


    .photo-4 {

      grid-column:
        7 / 13;

      aspect-ratio:
        4 / 3;

      margin-top:
        120px;
    }


    .photo-5 {

      grid-column:
        1 / 6;

      aspect-ratio:
        4 / 3;

      margin-top:
        60px;
    }


    .photo-6 {

      grid-column:
        8 / 12;

      aspect-ratio:
        3 / 4;

      margin-top:
        20px;
    }


    .photo-7 {

      grid-column:
        3 / 10;

      aspect-ratio:
        16 / 9;

      margin-top:
        100px;
    }


    .photo-8 {

      grid-column:
        1 / 5;

      aspect-ratio:
        3 / 4;

      margin-top:
        50px;
    }


    .photo-9 {

      grid-column:
        6 / 13;

      aspect-ratio:
        4 / 3;

      margin-top:
        120px;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {


      nav {

        padding:
          22px
          20px;
      }


      .logo {

        font-size: 14px;
      }


      .menu {

        gap: 15px;

        font-size: 9px;
      }


      .project-intro {

        padding:

          120px
          20px
          70px;
      }


      .project-intro h1 {

        font-size: 24px;

        margin-bottom:
          25px;
      }


      .project-intro p {

        font-size: 14px;

        max-width:
          100%;
      }


      .gallery {

        padding:

          0
          12px
          80px;

        display: grid;

        grid-template-columns:
          repeat(2, 1fr);

        gap: 12px;
      }


      .photo-1 {

        grid-column:
          1 / 3;

        aspect-ratio:
          4 / 3;

        margin-top: 0;
      }


      .photo-2 {

        grid-column:
          1 / 2;

        aspect-ratio:
          3 / 4;

        margin-top: 20px;
      }


      .photo-3 {

        grid-column:
          2 / 3;

        aspect-ratio:
          3 / 4;

        margin-top: 70px;
      }


      .photo-4 {

        grid-column:
          1 / 3;

        aspect-ratio:
          4 / 3;

        margin-top: 50px;
      }


      .photo-5 {

        grid-column:
          1 / 2;

        aspect-ratio:
          4 / 3;

        margin-top: 30px;
      }


      .photo-6 {

        grid-column:
          2 / 3;

        aspect-ratio:
          3 / 4;

        margin-top: 90px;
      }


      .photo-7 {

        grid-column:
          1 / 3;

        aspect-ratio:
          16 / 9;

        margin-top: 60px;
      }


      .photo-8 {

        grid-column:
          1 / 2;

        aspect-ratio:
          3 / 4;

        margin-top: 20px;
      }


      .photo-9 {

        grid-column:
          2 / 3;

        aspect-ratio:
          4 / 3;

        margin-top: 100px;
      }

    }

  </style>

</head>
