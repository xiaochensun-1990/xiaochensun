<!DOCTYPE html>

<head>

  <meta

    content="width=device-width, initial-scale=1.0"
  >

  <title>Dengke — XIAOCHEN SUN</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      background: #111;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    a {

      color: inherit;

      text-decoration: none;
    }


    /* =========================
       NAVIGATION
       ========================= */

    nav {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      padding: 28px 40px;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      z-index: 100;
    }


    .logo {

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 2px;
    }


    .menu {

      display: flex;

      gap: 30px;

      font-size: 11px;

      letter-spacing: 2px;
    }


    .menu a {

      transition:
        opacity 0.3s ease;
    }


    .menu a:hover {

      opacity: 0.5;
    }


    /* =========================
       PROJECT INTRODUCTION
       ========================= */

    .project-intro {

      max-width: 720px;

      margin: 0 auto;

      padding:

        150px
        40px
        90px;
    }


    .project-intro h1 {

      font-size: 28px;

      font-weight: 500;

      letter-spacing: 1px;

      margin-bottom: 35px;
    }


    .project-intro p {

      font-size: 15px;

      line-height: 1.8;

      color: #aaa;
    }


    /* =========================
       PHOTO GRID
       ========================= */

    .gallery {

      width: 100%;

      padding:

        0
        30px
        100px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 30px;
    }


    .photo {

      width: 100%;

      aspect-ratio: 4 / 3;

      overflow: hidden;

      background: #222;
    }


    .photo img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      transition:
        transform 0.5s ease,
        opacity 0.5s ease;
    }


    .photo:hover img {

      transform: scale(1.03);

      opacity: 0.85;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {


      nav {

        padding:
          22px
          20px;
      }


      .logo {

        font-size: 14px;
      }


      .menu {

        gap: 15px;

        font-size: 9px;
      }


      .project-intro {

        padding:

          120px
          20px
          60px;
      }


      .project-intro h1 {

        font-size: 24px;

        margin-bottom: 25px;
      }


      .project-intro p {

        font-size: 14px;
      }


      .gallery {

        padding:

          0
          12px
          70px;

        grid-template-columns:
          repeat(2, 1fr);

        gap: 12px;
      }

    }

  </style>

</head>
