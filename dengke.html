<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dengke — XIAOCHEN SUN</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      background: #111;

      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    a {

      color: inherit;

      text-decoration: none;
    }


    /* =========================
       NAVIGATION
       ========================= */

    nav {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      padding: 28px 40px;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      z-index: 100;
    }


    .logo {

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 2px;
    }


    .menu {

      display: flex;

      gap: 30px;

      font-size: 11px;

      letter-spacing: 2px;
    }


    .menu a {

      transition:
        opacity 0.3s ease;
    }


    .menu a:hover {

      opacity: 0.5;
    }


    /* =========================
       PROJECT HEADER
       ========================= */

    .project-header {

      padding:

        160px
        40px
        100px;

      max-width: 1200px;
    }


    .project-number {

      font-size: 10px;

      letter-spacing: 3px;

      color: #888;

      margin-bottom: 25px;
    }


    .project-title {

      font-size:
        clamp(
          70px,
          12vw,
          170px
        );

      line-height: 0.85;

      letter-spacing: -6px;

      font-weight: 600;
    }


    .project-year {

      margin-top: 30px;

      font-size: 11px;

      letter-spacing: 2px;

      color: #999;
    }


    /* =========================
       INTRODUCTION
       ========================= */

    .project-intro {

      max-width: 650px;

      margin:

        0
        auto
        160px;

      padding:

        0
        40px;

      font-size: 17px;

      line-height: 1.7;

      color: #bbb;
    }


    /* =========================
       PHOTOGRAPHS
       ========================= */

    .gallery {

      width: 100%;
    }


    .photo {

      margin-bottom: 14vw;

      padding:

        0
        5vw;
    }


    .photo img {

      display: block;

      width: 100%;

      height: auto;

      max-height: 90vh;

      object-fit: contain;
    }


    /* Large horizontal image */

    .photo.large {

      padding:

        0
        5vw;
    }


    /* Smaller image */

    .photo.small {

      width: 65%;

      margin-left: auto;

      margin-right: auto;
    }


    /* Two photographs */

    .photo-pair {

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 14px;

      padding:

        0
        5vw;

      margin-bottom: 14vw;
    }


    .photo-pair img {

      width: 100%;

      height: auto;

      display: block;
    }


    /* =========================
       PROJECT END
       ========================= */

    .project-end {

      padding:

        100px
        40px
        160px;

      border-top:
        1px solid #333;

      margin-top: 50px;

      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-end;
    }


    .next-project {

      font-size:
        clamp(
          35px,
          5vw,
          70px
        );

      letter-spacing: -2px;
    }


    .back-projects {

      font-size: 11px;

      letter-spacing: 2px;

      color: #999;
    }


    .back-projects:hover {

      color: #fff;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      nav {

        padding:
          22px
          20px;
      }


      .logo {

        font-size: 14px;
      }


      .menu {

        gap: 15px;

        font-size: 9px;
      }


      .project-header {

        padding:

          120px
          20px
          70px;
      }


      .project-title {

        font-size: 22vw;

        letter-spacing: -4px;
      }


      .project-intro {

        padding:
          0
          20px;

        margin-bottom:
          100px;

        font-size: 15px;
      }


      .photo {

        padding:
          0
          20px;

        margin-bottom:
          20vw;
      }


      .photo.large {

        padding:
          0
          20px;
      }


      .photo.small {

        width: 85%;
      }


      .photo-pair {

        grid-template-columns:
          1fr;

        padding:
          0
          20px;

        margin-bottom:
          20vw;
      }


      .project-end {

        padding:

          80px
          20px
          100px;

        flex-direction:
          column;

        align-items:
          flex-start;

        gap: 50px;
      }

    }

  </style>

</head>


<body>

      <a href="about.html">

  <!-- =========================

    <!-- Photograph 02 -->

      <img

    </div>


    <!-- Photograph 03 -->

    <div class="photo-pair">

      <img
        src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=90"

      >


      <img
        src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=1600&q=90"
        alt="Dengke documentary photography"
      >

    </div>


    <!-- Photograph 04 -->

    <div class="photo large">

      <img
        src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2400&q=90"

      >

    </div>


    <!-- Photograph 05 -->

    <div class="photo small">

      <img
        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1800&q=90"
        alt="Dengke documentary photography"
      >

    </div>


  </main>


  <!-- =========================
       PROJECT END
       ========================= -->

  <section class="project-end">


    <a
      href="projects.html"
      class="back-projects"
    >
      ← ALL PROJECTS
    </a>


    <a
      href="tibetan-plateau.html"

</body>

</html>
