<script>

/* =========================
   LIGHTBOX
   ========================= */

const photos =
  document.querySelectorAll(
    ".photo img"
  );

const lightbox =
  document.getElementById(
    "lightbox"
  );

const lightboxImage =
  document.getElementById(
    "lightboxImage"
  );

const closeButton =
  document.getElementById(
    "close"
  );

const prevButton =
  document.getElementById(
    "prev"
  );

const nextButton =
  document.getElementById(
    "next"
  );


let currentIndex = 0;



/* OPEN PHOTO */

function openLightbox(index) {

  currentIndex = index;

  lightboxImage.src =
    photos[currentIndex].src;

  lightboxImage.alt =
    photos[currentIndex].alt;

  lightbox.classList.add(
    "active"
  );

  document.body.style.overflow =
    "hidden";

}



/* CLOSE PHOTO */

function closeLightbox() {

  lightbox.classList.remove(
    "active"
  );

  document.body.style.overflow =
    "";

}



/* NEXT PHOTO */

function showNext() {

  currentIndex++;

  if (
    currentIndex >= photos.length
  ) {

    currentIndex = 0;

  }

  lightboxImage.src =
    photos[currentIndex].src;

  lightboxImage.alt =
    photos[currentIndex].alt;

}



/* PREVIOUS PHOTO */

function showPrevious() {

  currentIndex--;

  if (
    currentIndex < 0
  ) {

    currentIndex =
      photos.length - 1;

  }

  lightboxImage.src =
    photos[currentIndex].src;

  lightboxImage.alt =
    photos[currentIndex].alt;

}



/* CLICK THUMBNAIL */

photos.forEach(
  (photo, index) => {

    photo.addEventListener(
      "click",
      () => {

        openLightbox(index);

      }
    );

  }
);



/* BUTTONS */

closeButton.addEventListener(
  "click",
  closeLightbox
);


nextButton.addEventListener(
  "click",
  showNext
);


prevButton.addEventListener(
  "click",
  showPrevious
);



/* CLICK BACKGROUND TO CLOSE */

lightbox.addEventListener(
  "click",
  (event) => {

    if (
      event.target === lightbox
    ) {

      closeLightbox();

    }

  }
);



/* KEYBOARD */

document.addEventListener(
  "keydown",
  (event) => {

    if (
      !lightbox.classList.contains(
        "active"
      )
    ) {

      return;

    }


    if (
      event.key === "Escape"
    ) {

      closeLightbox();

    }


    if (
      event.key === "ArrowRight"
    ) {

      showNext();

    }


    if (
      event.key === "ArrowLeft"
    ) {

      showPrevious();

    }

  }
);

</script>
