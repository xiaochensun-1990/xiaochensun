<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projects — TOM SUN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Navigation */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(17, 17, 17, 0.85);
      backdrop-filter: blur(8px);
    }

    .logo {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .menu {
      display: flex;
      gap: 30px;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .menu a {
      transition: opacity 0.3s ease;
    }

    .menu a:hover {
      opacity: 0.5;
    }

    /* Projects */

    main {
      padding: 150px 40px 100px;
    }

    .page-title {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 70px;
    }

    .project {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      padding-bottom: 100px;
      margin-bottom: 100px;
      border-bottom: 1px solid #333;
      align-items: end;
    }

    .project-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      filter: grayscale(100%);
      transition: filter 0.5s ease;
    }

    .project:hover .project-image {
      filter: grayscale(0%);
    }

    .project-info {
      padding-bottom: 10px;
    }

    .project-name {
      font-size: clamp(35px, 5vw, 70px);
      line-height: 0.95;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .project-year {
      font-size: 11px;
      letter-spacing: 2px;
      color: #999;
    }

    /* Mobile */

    @media (max-width: 700px) {

      nav {
        padding: 22px 20px;
      }

      .menu {
        gap: 15px;
        font-size: 9px;
      }

      .logo {
        font-size: 14px;
      }

      main {
        padding: 120px 20px 60px;
      }

      .page-title {
        margin-bottom: 50px;
      }

      .project {
        grid-template-columns: 1fr;
        gap: 25px;
        padding-bottom: 60px;
        margin-bottom: 60px;
      }

      .project-info {
        padding-bottom: 0;
      }

      .project-name {
        font-size: 45px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="logo">
      TOM SUN
    </a>

    <div class="menu">
      <a href="projects.html">PROJECTS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </div>

  </nav>


  <main>

    <div class="page-title">
      Projects
    </div>


    <a href="#" class="project">

      <img
        class="project-image"
        src="https://images.unsplash.com/photo-1533130061792-64b345e4a833?auto=format&fit=crop&w=1800&q=90"
        alt="Dengke"
      >

      <div class="project-info">
        <div class="project-name">
          DENGKE
        </div>

        <div class="project-year">
          2026
        </div>
      </div>

    </a>


    <a href="#" class="project">

      <img
        class="project-image"
        src="https://images.unsplash.com/photo-1539635278303-d4002c07eae3?auto=format&fit=crop&w=1800&q=90"
        alt="The Tibetan Plateau"
      >

      <div class="project-info">
        <div class="project-name">
          THE TIBETAN PLATEAU
        </div>

        <div class="project-year">
          2026
        </div>
      </div>

    </a>


    <a href="#" class="project">

      <img
        class="project-image"
        src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1800&q=90"
        alt="People"
      >

      <div class="project-info">
        <div class="project-name">
          PEOPLE
        </div>

        <div class="project-year">
          ONGOING
        </div>
      </div>

    </a>


    <a href="#" class="project">

      <img
        class="project-image"
        src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=1800&q=90"
        alt="China"
      >

      <div class="project-info">
        <div class="project-name">
          CHINA
        </div>

        <div class="project-year">
          ONGOING
        </div>
      </div>

    </a>

  </main>

</body>
</html>
