<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Contact — XIAOCHEN SUN</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  min-height: 100%;
}

body {

  background: #111;

  color: #fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

a {

  color: inherit;

  text-decoration: none;

}


/* =========================
   NAVIGATION
   ========================= */

nav {

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;

  background: #111;

  padding:
    28px 40px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  z-index: 100;

}


.logo {

  font-size: 16px;

  font-weight: 600;

  letter-spacing: 2px;

}


.menu {

  display: flex;

  gap: 30px;

  font-size: 11px;

  letter-spacing: 2px;

}


.menu-item {

  position: relative;

}


.menu-item > a,
.projects-button {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 11px;

  letter-spacing: 2px;

  color: #fff;

  text-decoration: none;

  white-space: nowrap;

  background: none;

  border: none;

  padding: 0;

  cursor: pointer;

}


.menu-item > a:hover,
.projects-button:hover {

  opacity: 0.55;

}


/* =========================
   PROJECTS DROPDOWN
   ========================= */

.dropdown {

  position: absolute;

  top: 22px;

  right: 0;

  min-width: 120px;

  padding-top: 10px;

  background: #111;

  opacity: 0;

  visibility: hidden;

  transform:
    translateY(-5px);

  transition:
    opacity 0.25s ease,
    transform 0.25s ease,
    visibility 0.25s ease;

}


/* Desktop hover */

.projects:hover .dropdown {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);

}


/* Mobile / click */

.projects.open .dropdown {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);

}


.dropdown a {

  display: block;

  padding:
    6px 0;

  text-align: right;

  font-size: 10px;

  letter-spacing: 1.8px;

  color: #fff;

  text-decoration: none;

  white-space: nowrap;

}


.dropdown a:hover {

  opacity: 0.55;

}


/* =========================
   CONTACT CONTENT
   ========================= */

.contact {

  min-height: 100vh;

  padding:
    150px
    40px
    100px;

}


.contact-info {

  max-width: 650px;

}


.contact-row {

  margin-bottom: 30px;

}


.contact-label {

  display: block;

  margin-bottom: 8px;

  font-size: 10px;

  letter-spacing: 2px;

  color: #777;

}


.contact-value {

  font-size: 16px;

  line-height: 1.6;

  color: #ddd;

}


.contact-value a {

  transition:
    opacity 0.3s ease;

}


.contact-value a:hover {

  opacity: 0.5;

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

  nav {

    padding:
      22px 20px;

    background: #111;

  }


  .logo {

    font-size: 14px;

  }


  .menu {

    gap: 15px;

  }


  .menu-item > a,
  .projects-button {

    font-size: 9px;

    letter-spacing: 1.5px;

  }


  .dropdown {

    top: 19px;

  }


  .dropdown a {

    font-size: 9px;

  }


  .contact {

    padding:
      120px
      20px
      70px;

  }


  .contact-value {

    font-size: 14px;

  }

}

</style>

</head>


<body>


<!-- =========================
     NAVIGATION
     ========================= -->

<nav>


  <a
    href="index.html"
    class="logo"
  >
    XIAOCHEN SUN
  </a>


  <div class="menu">


    <!-- PROJECTS -->

    <div
      class="menu-item projects"
      id="projectsMenu"
    >

      <button
        class="projects-button"
        id="projectsButton"
        type="button"
      >
        PROJECTS
      </button>


      <div class="dropdown">

        <a href="dengke.html">
          DENGKE
        </a>

        <a href="xigaze-earthquake.html">
          XIGAZE EARTHQUAKE
        </a>

        <a href="song-of-the-southern-tianshan.html">
          SONG OF THE SOUTHERN TIANSHAN
        </a>

      </div>

    </div>


    <!-- ABOUT -->

    <div class="menu-item">

      <a href="about.html">
        ABOUT
      </a>

    </div>


    <!-- CONTACT -->

    <div class="menu-item">

      <a href="contact.html">
        CONTACT
      </a>

    </div>


  </div>

</nav>



<!-- =========================
     CONTACT
     ========================= -->

<main class="contact">


  <div class="contact-info">


    <!-- EMAIL -->

    <div class="contact-row">

      <span class="contact-label">
        EMAIL
      </span>

      <div class="contact-value">

        <a
          href="mailto:xiaochensun1990@gmail.com"
        >
          xiaochensun1990@gmail.com
        </a>

      </div>

    </div>



    <!-- WECHAT -->

    <div class="contact-row">

      <span class="contact-label">
        WECHAT
      </span>

      <div class="contact-value">

        sxcfoto

      </div>

    </div>



    <!-- INSTAGRAM -->

    <div class="contact-row">

      <span class="contact-label">
        INSTAGRAM
      </span>

      <div class="contact-value">

        <a
          href="https://www.instagram.com/xiaochensun_tom"
          target="_blank"
          rel="noopener noreferrer"
        >
          @xiaochensun_tom
        </a>

      </div>

    </div>


  </div>


</main>



<script>

/* =========================
   PROJECTS MENU
   ========================= */

const projectsButton =
  document.getElementById(
    "projectsButton"
  );

const projectsMenu =
  document.getElementById(
    "projectsMenu"
  );


projectsButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    projectsMenu.classList.toggle(
      "open"
    );

  }
);


/* Close menu when clicking elsewhere */

document.addEventListener(
  "click",
  function(event) {

    if (
      !projectsMenu.contains(event.target)
    ) {

      projectsMenu.classList.remove(
        "open"
      );

    }

  }
);

</script>


</body>

</html>
