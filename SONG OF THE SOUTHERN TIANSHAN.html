<style>

/* =========================
   BASIC
   ========================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #1b2025;
  color: #f2f2f2;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 400;
  line-height: 1.5;
}


/* =========================
   HEADER
   ========================= */

header {
  width: 100%;
  padding: 30px 4vw 26px 4vw;

  display: flex;
  justify-content: space-between;
  align-items: center;

  position: sticky;
  top: 0;
  z-index: 100;

  background: rgba(27, 32, 37, 0.96);
  backdrop-filter: blur(8px);
}

.logo {
  color: #ffffff;
  text-decoration: none;

  font-size: 16px;
  letter-spacing: 0.08em;
  font-weight: 500;
}

nav {
  display: flex;
  gap: 30px;
}

nav a {
  color: #ffffff;
  text-decoration: none;

  font-size: 13px;
  letter-spacing: 0.08em;

  transition: opacity 0.3s ease;
}

nav a:hover {
  opacity: 0.5;
}


/* =========================
   PROJECT INTRO
   ========================= */

.project-intro {
  width: 92%;
  max-width: 1500px;

  margin: 55px auto 65px auto;

  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 40px;
}

.project-title {
  font-size: clamp(22px, 2.2vw, 34px);

  font-weight: 400;

  letter-spacing: 0.08em;

  line-height: 1.2;
}

.project-description {
  max-width: 420px;

  font-size: 13px;

  line-height: 1.8;

  color: #b8bdc2;

  text-align: right;
}


/* =========================
   GALLERY
   ========================= */

.gallery {
  width: 92%;
  max-width: 1500px;

  margin: 0 auto 100px auto;

  columns: 3;
  column-gap: 22px;
}

.gallery figure {
  width: 100%;

  margin: 0 0 22px 0;

  break-inside: avoid;

  overflow: hidden;
}

.gallery img {
  width: 100%;
  height: auto;

  display: block;

  border-radius: 2px;

  transition:
    transform 0.6s ease,
    opacity 0.6s ease;
}

.gallery figure:hover img {
  transform: scale(1.015);
  opacity: 0.92;
}


/* =========================
   PHOTO NUMBER
   ========================= */

.photo-number {
  display: block;

  margin-top: 8px;

  color: #777e84;

  font-size: 9px;

  letter-spacing: 0.08em;
}


/* =========================
   FOOTER
   ========================= */

footer {
  width: 92%;
  max-width: 1500px;

  margin: 0 auto;

  padding: 35px 0 50px 0;

  border-top: 1px solid #343a40;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

footer p {
  color: #777e84;

  font-size: 10px;

  letter-spacing: 0.08em;
}

.back {
  color: #ffffff;

  text-decoration: none;

  font-size: 10px;

  letter-spacing: 0.08em;

  transition: opacity 0.3s ease;
}

.back:hover {
  opacity: 0.5;
}


/* =========================
   TABLET
   ========================= */

@media (max-width: 1000px) {

  .gallery {
    columns: 2;
    column-gap: 18px;
  }

  .gallery figure {
    margin-bottom: 18px;
  }

  .project-intro {
    margin-top: 45px;
    margin-bottom: 50px;
  }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 650px) {

  header {
    padding: 22px 5vw 20px 5vw;
  }

  .logo {
    font-size: 13px;
  }

  nav {
    gap: 16px;
  }

  nav a {
    font-size: 10px;
  }


  .project-intro {
    width: 90%;

    margin: 38px auto 40px auto;

    display: block;
  }

  .project-title {
    font-size: 19px;

    letter-spacing: 0.07em;
  }

  .project-description {
    max-width: none;

    margin-top: 18px;

    font-size: 11px;

    line-height: 1.7;

    text-align: left;
  }


  .gallery {
    width: 90%;

    columns: 2;

    column-gap: 10px;

    margin-bottom: 65px;
  }

  .gallery figure {
    margin-bottom: 10px;
  }

  .photo-number {
    display: none;
  }


  footer {
    width: 90%;

    padding: 25px 0 35px 0;
  }

  footer p,
  .back {
    font-size: 9px;
  }

}

</style>

</head>
