<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>XIAOCHEN SUN — Documentary Photography</title>


<style>

/* =========================
   BASIC
   ========================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {

  width: 100%;
  height: 100%;

}

body {

  background: #111;

  color: #fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  overflow: hidden;

}


/* =========================
   HERO IMAGE
   ========================= */

.hero {

  position: fixed;

  inset: 0;

  width: 100vw;

  height: 100vh;

  background-image:
    url("HOME-01.JPG");

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

}


/* =========================
   NAVIGATION
   ========================= */

nav {

  position: fixed;

  top: 0;

  left: 0;

  width: 100%;

  padding: 28px 40px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  z-index: 100;

}


/* =========================
   LOGO
   ========================= */

.logo {

  font-size: 16px;

  font-weight: 600;

  letter-spacing: 2px;

  color: #fff;

  text-decoration: none;

}


/* =========================
   PROJECTS MENU
   ========================= */

.projects {

  position: relative;

}


.projects-button {

  font-size: 11px;

  letter-spacing: 2px;

  color: #fff;

  text-decoration: none;

  cursor: pointer;

}


/* =========================
   DROPDOWN
   ========================= */

.dropdown {

  position: absolute;

  top: 24px;

  right: 0;

  min-width: 150px;

  padding-top: 12px;

  opacity: 0;

  visibility: hidden;

  transform:
    translateY(-5px);

  transition:

    opacity 0.25s ease,

    transform 0.25s ease,

    visibility 0.25s ease;

}


.projects:hover
.dropdown {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);

}


/* =========================
   DROPDOWN LINKS
   ========================= */

.dropdown a {

  display: block;

  padding:

    7px
    0;

  color: #fff;

  font-size: 10px;

  letter-spacing: 1.8px;

  text-align: right;

  text-decoration: none;

  white-space: nowrap;

}


.dropdown a:hover {

  opacity: 0.55;

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

  nav {

    padding:

      22px
      20px;

  }


  .logo {

    font-size: 14px;

  }


  .projects-button {

    font-size: 9px;

  }


  .dropdown {

    top: 21px;

  }


  .dropdown a {

    font-size: 9px;

  }

}

</style>

</head>


<body>


<!-- =========================
     HERO IMAGE
     ========================= -->

<div class="hero"></div>



<!-- =========================
     NAVIGATION
     ========================= -->

<nav>


  <!-- LOGO -->

  <a
    href="index.html"
    class="logo"
  >
    XIAOCHEN SUN
  </a>



  <!-- PROJECTS -->

  <div class="projects">


    <a
      href="projects.html"
      class="projects-button"
    >
      PROJECTS
    </a>


    <!-- DROPDOWN -->

    <div class="dropdown">


      <a href="dengke.html">
        DENGKE
      </a>


      <!--
      以后新增摄影项目，
      只需要在这里增加一行：

      <a href="xxx.html">
        PROJECT NAME
      </a>
      -->


    </div>


  </div>


</nav>


</body>

</html>
