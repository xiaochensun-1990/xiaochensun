<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>XIAOCHEN SUN</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {

  width: 100%;
  height: 100%;

}

body {

  background: #000;

  color: #fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  overflow: hidden;

}

nav {

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;

  height: 76px;

  padding:
    28px 40px;

  background: #000;

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  z-index: 100;

}


/* =========================
   LOGO
   ========================= */

.logo {

  font-size: 16px;

  font-weight: 600;

  letter-spacing: 2px;

  color: #fff;

  text-decoration: none;

}


/* =========================
   MENU
   ========================= */

.menu {

  display: flex;

  align-items:
    flex-start;

  gap: 30px;

}


.menu-item {

  position: relative;

}


.menu-item > a,
.projects-button {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 11px;

  letter-spacing: 2px;

  color: #fff;

  text-decoration: none;

  white-space: nowrap;

  background: none;

  border: none;

  padding: 0;

  cursor: pointer;

}


.menu-item > a:hover,
.projects-button:hover {

  opacity: 0.55;

}


/* =========================
   PROJECTS DROPDOWN
   ========================= */

.dropdown {

  position: absolute;

  top: 22px;

  right: 0;

  min-width: 120px;

  padding-top: 10px;

  background: #000;

  opacity: 0;

  visibility: hidden;

  transform:
    translateY(-5px);

  transition:
    opacity 0.25s ease,
    transform 0.25s ease,
    visibility 0.25s ease;

}


/* Desktop hover */

.projects:hover .dropdown {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);

}


/* JavaScript click */

.projects.open .dropdown {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);

}


.dropdown a {

  display: block;

  padding:
    6px 0;

  text-align: right;

  font-size: 10px;

  letter-spacing: 1.8px;

  color: #fff;

  text-decoration: none;

  white-space: nowrap;

}


.dropdown a:hover {

  opacity: 0.55;

}


/* =========================
   HOME IMAGE
   ========================= */

.hero {

  position: fixed;

  top: 76px;

  left: 0;

  right: 0;

  bottom: 0;

  overflow: hidden;

  background: #000;

}


.hero img {

  width: 100%;

  height: 100%;

  display: block;

  object-fit: cover;

  object-position: center;

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

  nav {

    height: 62px;

    padding:
      22px 20px;

  }


  .logo {

    font-size: 14px;

  }


  .menu {

    gap: 15px;

  }


  .menu-item > a,
  .projects-button {

    font-size: 9px;

    letter-spacing: 1.5px;

  }


  .dropdown {

    top: 19px;

  }


  .dropdown a {

    font-size: 9px;

  }


  .hero {

    top: 62px;

  }

}

</style>

</head>


<body>


<!-- =========================
     NAVIGATION
     ========================= -->

<nav>


  <a
    href="index.html"
    class="logo"
  >
    XIAOCHEN SUN
  </a>


  <div class="menu">


    <!-- PROJECTS -->

    <div
      class="menu-item projects"
      id="projectsMenu"
    >

      <button
        class="projects-button"
        id="projectsButton"
        type="button"
      >
        PROJECTS
      </button>


      <div class="dropdown">

        <a href="dengke.html">
          DENGKE
        </a>


        <a href="Xigaze-earthquake.html">
          XIGAZE EARTHQUAKE
        </a>


        <a href="SONG%20OF%20THE%20SOUTHERN%20TIANSHAN.html">
          SONG OF THE SOUTHERN TIANSHAN
        </a>

      </div>

    </div>


    <!-- ABOUT -->

    <div class="menu-item">

      <a href="about.html">
        ABOUT
      </a>

    </div>


    <!-- CONTACT -->

    <div class="menu-item">

      <a href="contact.html">
        CONTACT
      </a>

    </div>


  </div>

</nav>



<!-- =========================
     HOME IMAGE
     ========================= -->

<div class="hero">

  <img
    src="Home.JPG"
    alt="Xiaochen Sun"
  >

</div>



<script>

/* =========================
   PROJECTS MENU
   ========================= */

const projectsButton =
  document.getElementById(
    "projectsButton"
  );

const projectsMenu =
  document.getElementById(
    "projectsMenu"
  );


projectsButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();

    projectsMenu.classList.toggle(
      "open"
    );

  }
);


/* Close menu when clicking elsewhere */

document.addEventListener(
  "click",
  function(event) {

    if (
      !projectsMenu.contains(event.target)
    ) {

      projectsMenu.classList.remove(
        "open"
      );

    }

  }
);

</script>


</body>

</html>
