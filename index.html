<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TOM SUN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .menu {
      display: flex;
      gap: 30px;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .menu a {
      transition: opacity 0.3s ease;
    }

    .menu a:hover {
      opacity: 0.5;
    }

    .hero {
      width: 100%;
      height: 100vh;
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.2)
        ),
        url("https://images.unsplash.com/photo-1533130061792-64b345e4a833?auto=format&fit=crop&w=2400&q=90")
        center center / cover no-repeat;
    }

    @media (max-width: 700px) {

      nav {
        padding: 22px 20px;
      }

      .menu {
        gap: 15px;
      }

      .logo {
        font-size: 14px;
      }

      .menu {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <a href="index.html" class="logo">
      TOM SUN
    </a>

    <div class="menu">
      <a href="projects.html">PROJECTS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </div>

  </nav>

  <main class="hero"></main>

</body>
</html>
