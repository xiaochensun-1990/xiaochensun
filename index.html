<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>XIAOCHEN SUN</title>


<style>

/* =========================
   BASIC
   ========================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {

  width: 100%;
  height: 100%;

}

body {

  background: #000;

  color: #fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  overflow: hidden;

}


/* =========================
   HOME IMAGE
   ========================= */

.hero {

  position: fixed;

  inset: 0;

  width: 100vw;

  height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #000;

}


.hero img {

  width: 100%;

  height: 100%;

  object-fit: contain;

  display: block;

}


/* =========================
   NAVIGATION
   ========================= */

nav {

  position: fixed;

  top: 0;

  left: 0;

  width: 100%;

  padding: 28px 40px;

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  z-index: 100;

}


/* =========================
   LOGO
   ========================= */

.logo {

  font-size: 16px;

  font-weight: 600;

  letter-spacing: 2px;

  color: #fff;

  text-decoration: none;

}


/* =========================
   RIGHT MENU
   ========================= */

.menu {

  display: flex;

  align-items: flex-start;

  gap: 30px;

}


.menu-item {

  position: relative;

}


.menu-item > a {

  font-size: 11px;

  letter-spacing: 2px;

  color: #fff;

  text-decoration: none;

  white-space: nowrap;

}


.menu-item > a:hover {

  opacity: 0.55;

}


/* =========================
   PROJECTS DROPDOWN
   ========================= */

.dropdown {

  position: absolute;

  top: 22px;

  right: 0;

  min-width: 140px;

  padding-top: 10px;

  opacity: 0;

  visibility: hidden;

  transform:
    translateY(-5px);

  transition:

    opacity 0.25s ease,

    transform 0.25s ease,

    visibility 0.25s ease;

}


.menu-item.projects:hover
.dropdown {

  opacity: 1;

  visibility: visible;

  transform:
    translateY(0);

}


.dropdown a {

  display: block;

  padding: 6px 0;

  text-align: right;

  font-size: 10px;

  letter-spacing: 1.8px;

  color: #fff;

  text-decoration: none;

  white-space: nowrap;

}


.dropdown a:hover {

  opacity: 0.55;

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

  nav {

    padding:
      22px
      20px;

  }


  .logo {

    font-size: 14px;

  }


  .menu {

    gap: 15px;

  }


  .menu-item > a {

    font-size: 9px;

    letter-spacing: 1.5px;

  }


  .dropdown {

    top: 19px;

  }


  .dropdown a {

    font-size: 9px;

  }

}

</style>

</head>


<body>


<!-- =========================
     HOME IMAGE
     ========================= -->

<div class="hero">

  <img
    src="Home.JPG"
    alt="XIAOCHEN SUN"
  >

</div>



<!-- =========================
     NAVIGATION
     ========================= -->

<nav>


  <!-- LOGO -->

  <a
    href="index.html"
    class="logo"
  >
    XIAOCHEN SUN
  </a>



  <!-- RIGHT MENU -->

  <div class="menu">


    <!-- PROJECTS -->

    <div
      class="menu-item projects"
    >

      <a href="projects.html">
        PROJECTS
      </a>


      <div class="dropdown">

        <a href="dengke.html">
          DENGKE
        </a>

      </div>

    </div>



    <!-- ABOUT -->

    <div class="menu-item">

      <a href="about.html">
        ABOUT
      </a>

    </div>



    <!-- CONTACT -->

    <div class="menu-item">

      <a href="contact.html">
        CONTACT
      </a>

    </div>


  </div>

</nav>


</body>

</html>
